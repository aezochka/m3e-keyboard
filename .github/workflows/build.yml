name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.M3E_KEYSTORE_PASSWORD }}
      KEY_ALIAS: m3e
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37
        run: yes | sdkmanager "platforms;android-37" > /dev/null || true

      - name: Decode signing keystore
        run: echo "${{ secrets.M3E_KEYSTORE_B64 }}" | base64 -d > app/m3e.jks

      - name: Unit tests (Robolectric smoke)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/M3EKeyboard-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/M3EKeyboard-release.apk
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: M3EKeyboard-apk
          path: out/*.apk
          if-no-files-found: error
